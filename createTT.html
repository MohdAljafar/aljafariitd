<script>
    
    
    let btn = document.querySelector("#btn");
    btn.onclick = () => {
        let x = document.createElement("div");
        x.setAttribute("class", "box");

        var courseName = document.querySelector("#coursename").value;

        var courseTime = document.querySelector("#coursetime").value;

        var CourseHeight = (parseFloat(document.querySelector("#coursedur").value) * 55);
        CourseHeight.toString();
        CourseHeight += "px";

        var fromTop = (parseInt(courseTime.substring(0,2))-7)*55;
        var min = courseTime.substring(3,5);
        if(min=="30"){
            fromTop = fromTop+(55/2);
        }
        fromTop.toString();
        fromTop = fromTop+"px";


        x.innerText = courseName;
        x.style.top = fromTop;
        x.style.height = CourseHeight;
        x.style.left = "20%";


        let node = document.querySelector(".time-table");
        node.append(x);

        console.log("DONE");
    }




    // downloading script as jpg

    document.getElementById('downloadbtn').addEventListener('click', function() {
    const timetable = document.getElementById("time-table-container"); //works only on Id

    html2canvas(timetable).then(canvas => {
        // Convert canvas to JPG
        let image = canvas.toDataURL("image/jpeg", 1.0);

        // Create a download link
        let link = document.createElement("a");
        link.download = "timetable.jpg";
        link.href = image;
        link.click();
    });
    });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
